import groovy.json.JsonBuilder

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0-SNAPSHOT'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.adarshr.test-logger' version '3.2.0'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.andino'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'net.javacrumbs.json-unit:json-unit-spring:3.2.7'
    implementation 'org.hamcrest:hamcrest-core:2.2'
    implementation 'io.qameta.allure:allure-junit5:2.24.0'
    implementation 'io.qameta.allure:allure-java-commons:2.24.0'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperties project.properties.subMap(["env"])
    ignoreFailures true
    finalizedBy 'generateTestSummary'
}


testlogger {
    theme 'standard'
    showExceptions true
    showStackTraces true
    showFullStackTraces false
    showCauses true
    slowThreshold 2000
    showSummary true
    showSimpleNames false
    showPassed true
    showSkipped true
    showFailed true
    showOnlySlow false
    showStandardStreams false
    showPassedStandardStreams true
    showSkippedStandardStreams true
    showFailedStandardStreams true
    logLevel 'lifecycle'
}

allure {
    version = '2.30.0'
    report {
        singleFile = true
    }
}

tasks.register('customizeAllureHtml') {
    dependsOn allureReport
    doLast {
        def indexHtml = file("$buildDir/reports/allure-report/allureReport/index.html")
        if (indexHtml.exists()) {
            def content = indexHtml.text

            // Replace the title
            content = content.replace("<title>Allure Report</title>", "<title>GIV Test Report</title>")

            // Write modified content back

            def scriptContent = '''
            <script>
                (function() {
                    // Initial replacement function
                    function replaceAllureWithGiv() {
                        // Walk through all text nodes in the document
                        const walker = document.createTreeWalker(
                            document.body, 
                            NodeFilter.SHOW_TEXT, 
                            null, 
                            false
                        );
                        
                        let node;
                        while (node = walker.nextNode()) {
                            if (node.nodeValue && node.nodeValue.includes('Allure')) {
                                node.nodeValue = node.nodeValue.replace(/Allure/g, 'GIV');
                            }
                        }
                    }
            
                    // Setup mutation observer to detect DOM changes
                    const observer = new MutationObserver(function(mutations) {
                        replaceAllureWithGiv();
                    });
                    
                    // Configuration for the observer
                    const config = { 
                        childList: true,     // observe direct children
                        subtree: true,       // and lower descendants too
                        characterData: true, // observe text changes
                        attributes: true     // observe attribute changes
                    };
                    
                    // Initial run on page load
                    window.addEventListener('DOMContentLoaded', function() {
                        replaceAllureWithGiv();
                        
                        // Start observing the document body for changes
                        observer.observe(document.body, config);
                        
                        // Additional event listeners for SPA navigation
                        // Many SPAs use popstate for navigation
                        window.addEventListener('popstate', function() {
                            setTimeout(replaceAllureWithGiv, 100);
                        });
                        
                        // Add listeners for clicks that might trigger navigation
                        document.body.addEventListener('click', function() {
                            setTimeout(replaceAllureWithGiv, 100);
                        });
                        
                        // Check periodically in case we miss some updates
                        setInterval(replaceAllureWithGiv, 1000);
                    });
                })();
            </script>
            '''
            content = content.replace("</head>", scriptContent + "\n</head>")
            indexHtml.text = content
        } else {
            logger.warn("Could not find index.html at ${indexHtml.absolutePath}")
        }
    }
}

tasks.named('allureReport').configure {
    finalizedBy customizeAllureHtml
}

tasks.create('generateTestSummary') {
    doLast {
        def testReportDir = file("$buildDir/test-results/test")
        def totalTests = 0
        def failedTests = 0
        def skippedTests = 0

        if (testReportDir.exists()) {
            def testSuits = testReportDir.listFiles().findAll { it.name.endsWith('.xml') }

            testSuits.each {
                def suite = new XmlParser().parse(it)

                def tests = suite.@tests[0] as Integer ?: 0
                def failures = suite.@failures[0] as Integer ?: 0
                def errors = suite.@errors[0] as Integer ?: 0
                def skipped = suite.@skipped[0] as Integer ?: 0

                totalTests += tests
                skippedTests += skipped
                failedTests += (failures + errors)
            }

            def passedTests = totalTests - failedTests - skippedTests
            def testResult = (failedTests > 0) ? "failure" : (totalTests == 0) ? "unknown" : "success"

            def summary = [
                    total  : totalTests,
                    passed : passedTests,
                    failed : failedTests,
                    skipped: skippedTests,
                    result : testResult,
            ]
            def jsonBuilder = new JsonBuilder(summary)
            file("${buildDir}/test-results/summary.json").text = jsonBuilder.toPrettyString()
        } else {
            logger.warn("Test report directory does not exist: ${testReportDir.absolutePath}")
        }

    }
}
