name: Run Smoke Tests
on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
    - cron: '0 11 * * *' # Every day at 8 AM Chile time
    - cron: '40 2 * * *' # Every day at 2:10 AM IST
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests against'
        required: false
        default: ''
        type: choice
        options:
          - production
          - staging
          - ''

permissions: write-all

jobs:
  build:
    runs-on:
      group: gh-runners-self-hosted
    permissions:
      deployments: write
      id-token: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10"

      - name: Build with Gradle
        run: gradle build allureReport -Penv=${{ github.event.inputs.env }}

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: '${{ github.workspace }}/**/build/reports'
          name: reports

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update index.html
        run: |
          # Copy the new index.html file to gh-pages directory
          cp "${{ github.workspace }}/build/reports/allure-report/allureReport/index.html" gh-pages/
          
          # Commit and push changes
          cd gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Update Allure report" || echo "No changes to commit"
          git push origin gh-pages