arrange:
  - name: Begin Full Sync
    type: api
    act:
      url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v2/full-sync
      method: POST
      body: {
        "system": "PARIS_EOM",
        "nodeCode": "AUTOMATION_NODE_2",
        "generatedAt": "${generate:datetime:now}",
        "fileName": "${generate:string:fileName}.csv",
        "businessUnit": "PARIS",
        "countryCode": "CL",
        "batches": [
          {
            "startIndex": 0,
            "endIndex": 1
          }
        ]
      }
    saveResponseAs: beginFullSync

act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/supplies
  method: PUT
  body: {
    "meta": {
      "jobId": {
        "id": "${beginFullSync.jobId.id}",
        "createdAt": "${beginFullSync.jobId.createdAt}"
      }
    },
    "items": [
      {
        "id": "TEST_AUTOMATION_002",
        "nodeCode": "AUTOMATION_NODE_2",
        "supplyType": "ATP",
        "updateType": "ABSOLUTE",
        "quantity": {
          "value": 350.0,
          "unitOfMeasure": "UNITS"
        },
        "condition": "NEW",
        "updatedAt": "${generate:datetime:1minutesAgo}"

      }

    ]
  }

asserts:
  status: 200
  customization:
    body:
      options:
        - IGNORING_EXTRA_FIELDS
        - IGNORING_ARRAY_ORDER
        - IGNORING_EXTRA_ARRAY_ITEMS
  body: {
  "inSyncItems": [],
  "outOfSyncItems": [
    {
      "id": "TEST_AUTOMATION_002",
      "system": "PARIS_EOM",
      "nodeCode": "AUTOMATION_NODE_2",
      "nodeId": "85616559-dc11-4d79-87ad-ad5a0a3608a4",
      "condition": "NEW",
      "supplyType": "ATP",
      "mismatch_type": "UPDATE",
      "previousQuantity": {
        "value": 350.0,
        "unitOfMeasure": "UNITS"
      },
      "updatedQuantity": {
        "value": 350.0,
        "unitOfMeasure": "UNITS"
      },
      "sourceUpdateEvent": "FULL_SYNC",
      "sourceUpdatedAt": "${json-unit.matches:any-zoned-date-time}"
    }
  ],
  "ignoredItems": [],
  "failedItems": [],
  "nodes": [
    "AUTOMATION_NODE_2"
  ]
}
