arrange:
  - name: Add Stock for Item + Node
    type: api
    act:
      url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/supplies/update
      method: PUT
      body:
        businessUnit: PARIS
        countryCode: CL
        items:
          - id: TEST_AUTOMATION_21
            nodeCode: test-node
            supplyType: ATP
            updateType: ABSOLUTE
            quantity:
              value: 999
              unitOfMeasure: UNITS
            condition: NEW
            updatedAt: "${generate:datetime:now}"
    saveResponseAs: stock

  - name: Reserve Demand (Single Item + Node)
    type: api
    act:
      url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/demands
      method: POST
      headers:
        X-Business-Unit:
          - PARIS
        X-Country-Code:
          - CL
      body:
        meta:
          referenceId: "${generate:string:uuid}"
          orderId: "${generate:string:uuid}"
          orderType: CUSTOMER_ORDER
          expiryInMilliseconds: 2000
          channel: MOBILE
          geoCode: "13114"
          geoType: COMUNA
        reservations:
          - itemId: TEST_AUTOMATION_21
            condition: NEW
            promiseDeliveryDate: "${generate:datetime:tomorrow}"
            quantity:
              value: 1
              unitOfMeasure: UNITS
            nodeCode: test-node
            riskLevel: LOW
            orderLineId: "1"
            sellerType: 1P
            logisticSize: SMALL
            shipping:
              type: DELIVERY
              subType: HOME
              method: NEXT_DAY
    saveResponseAs: DemandReservation

  - name: Wait for 2 seconds
    type: wait
    waitMillis: 60000

act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/demands/allocate
  method: PUT
  headers:
    X-Business-Unit:
      - PARIS
    X-Country-Code:
      - CL
  body:
    id: "${DemandReservation.meta.referenceId}"
    type: "REFERENCE"

asserts:
  status: 422
  customization:
    body:
      options:
        - IGNORING_EXTRA_FIELDS
  body:
    status: 422
    errors:
      - code: DEMAND_IS_IN_INVALID_STATUS