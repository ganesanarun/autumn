act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/demands/expire
  method: PUT
  headers:
    X-Business-Unit:
      - PARIS
    X-Country-Code:
      - CL
  body:
    id: "${generate:string:uuid}"
    type: "REFERENCE"

asserts:
  status: 404
  customization:
    body:
      options:
        - IGNORING_EXTRA_FIELDS
  body:
    status: 404
    errors:
      - code: DEMAND_NOT_FOUND