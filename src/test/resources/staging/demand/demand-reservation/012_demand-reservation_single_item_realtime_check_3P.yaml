arrange:
  - name: Add Stock for Item + Node
    type: api
    act:
      url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/supplies/update
      method: PUT
      body:
        businessUnit: PARIS
        countryCode: CL
        items:
          - id: MK2NHMYUVC-2
            nodeCode: c6a52e7c-f3e7-4149-b231-d376be9a4420
            supplyType: ATP
            updateType: ABSOLUTE
            quantity:
              value: 3
              unitOfMeasure: UNITS
            condition: NEW
            updatedAt: "${generate:datetime:now}"
    saveResponseAs: stock

act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/demands
  method: POST
  headers:
    X-Business-Unit:
      - PARIS
    X-Country-Code:
      - CL
  body:
    meta:
      referenceId: "${generate:string}"
      orderId: "${generate:string}"
      orderType: CUSTOMER_ORDER
      expiryInMilliseconds: 120000
      channel: MOBILE
      geoCode: "13114"
      geoType: COMUNA
    reservations:
      - itemId: "${stock.successfulItems[0].id}"
        condition: "${stock.successfulItems[0].condition}"
        promiseDeliveryDate: "${generate:datetime:tomorrow}"
        quantity:
          value: 5
          unitOfMeasure: "${stock.successfulItems[0].quantity.unitOfMeasure}"
        nodeCode: "${stock.successfulItems[0].nodeCode}"
        riskLevel: HIGH
        orderLineId: "1"
        sellerType: 3P
        logisticSize: SMALL
        shipping:
          type: DELIVERY
          subType: HOME
          method: NEXT_DAY
asserts:
  status: 422
  customization:
    body:
      options:
        - IGNORING_EXTRA_FIELDS
        - IGNORING_VALUES
  body: {}