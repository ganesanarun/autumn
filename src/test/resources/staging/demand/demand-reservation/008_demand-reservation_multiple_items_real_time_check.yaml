arrange:
  - name: Add Stock for multi line Items + same Node code
    type: api
    act:
      url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/supplies/update
      method: PUT
      body:
        businessUnit: PARIS
        countryCode: CL
        items:
          - id: test_1
            nodeCode: test_node
            supplyType: ATP
            updateType: ABSOLUTE
            quantity:
              value: 10
              unitOfMeasure: UNITS
            condition: NEW
            updatedAt: "${generate:datetime:now}"
          - id: test_2
            nodeCode: test_node
            supplyType: ATP
            updateType: ABSOLUTE
            quantity:
              value: 10
              unitOfMeasure: UNITS
            condition: NEW
            updatedAt: "${generate:datetime:now}"
    saveResponseAs: stock

act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/demands
  method: POST
  headers:
    X-Business-Unit:
      - PARIS
    X-Country-Code:
      - CL
  body:
    meta:
      referenceId: "${generate:string}"
      orderId: "${generate:string}"
      orderType: CUSTOMER_ORDER
      expiryInMilliseconds: 120000
      channel: MOBILE
      geoCode: "13114"
      geoType: COMUNA
    reservations:
      - itemId: "${stock.successfulItems[0].id}"
        condition: "${stock.successfulItems[0].condition}"
        promiseDeliveryDate: "${generate:datetime:tomorrow}"
        quantity:
          value: 1
          unitOfMeasure: "${stock.successfulItems[0].quantity.unitOfMeasure}"
        nodeCode: "${stock.successfulItems[0].nodeCode}"
        riskLevel: HIGH
        orderLineId: "3"
        sellerType: 1P
        logisticSize: SMALL
        shipping:
          type: DELIVERY
          subType: HOME
          method: NEXT_DAY
      - itemId: "${stock.successfulItems[1].id}"
        condition: "${stock.successfulItems[1].condition}"
        promiseDeliveryDate: "${generate:datetime:tomorrow}"
        quantity:
          value: 1
          unitOfMeasure: "${stock.successfulItems[1].quantity.unitOfMeasure}"
        nodeCode: "${stock.successfulItems[1].nodeCode}"
        riskLevel: HIGH
        orderLineId: "4"
        sellerType: 1P
        logisticSize: SMALL
        shipping:
          type: DELIVERY
          subType: HOME
          method: NEXT_DAY


asserts:
  status: 200
  customization:
  body:
    meta:
      referenceId: "defaultString"
      orderId: "defaultString"
      demandId: "${json-unit.matches:any-uuid}"
      geoCode: "13114"
      geoType: COMUNA
    reservations:
      - itemId: "test_1"
        condition: "NEW"
        promiseDeliveryDate: "${json-unit.matches:any-zoned-date-time}"
        nodeCode: "test_node"
        status: "RESERVED"
        demandItemId: "${json-unit.matches:any-uuid}"
        orderLineId: "3"
        expiryTime: "${json-unit.matches:any-zoned-date-time}"
      - itemId: "test_2"
        condition: "NEW"
        promiseDeliveryDate: "${json-unit.matches:any-zoned-date-time}"
        nodeCode: "test_node"
        status: "RESERVED"
        demandItemId: "${json-unit.matches:any-uuid}"
        orderLineId: "4"
        expiryTime: "${json-unit.matches:any-zoned-date-time}"


