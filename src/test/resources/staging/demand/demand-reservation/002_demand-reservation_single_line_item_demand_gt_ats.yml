arrange:
  - name: Add Stock for Item + Node when demand is greater than ATS
    type: api
    act:
      url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/supplies/update
      method: PUT
      body:
        businessUnit: PARIS
        countryCode: CL
        items:
          - id: TEST_AUTOMATION_11
            nodeCode: AUTOMATION_NODE_1
            supplyType: ATP
            updateType: ABSOLUTE
            quantity:
              value: 10
              unitOfMeasure: UNITS
            condition: NEW
            updatedAt: "${generate:datetime:now}"
    saveResponseAs: stock

act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v1/demands
  method: POST
  headers:
    X-Business-Unit:
      - PARIS
    X-Country-Code:
      - CL
  body:
    meta:
      referenceId: "${generate:string}"
      orderId: "${generate:string}"
      orderType: CUSTOMER_ORDER
      expiryInMilliseconds: 120000
      channel: MOBILE
      geoCode: "13114"
      geoType: COMUNA
    reservations:
      - itemId: "${stock.successfulItems[0].id}"
        condition: "${stock.successfulItems[0].condition}"
        promiseDeliveryDate: "${generate:datetime:tomorrow}"
        quantity:
          value: 11
          unitOfMeasure: "${stock.successfulItems[0].quantity.unitOfMeasure}"
        nodeCode: "${stock.successfulItems[0].nodeCode}"
        riskLevel: LOW
        orderLineId: "1"
        sellerType: 1P
        logisticSize: SMALL
        shipping:
          type: DELIVERY
          subType: HOME
          method: NEXT_DAY

asserts:
  status: 422
  customization:
    body:
      options:
        - IGNORING_EXTRA_FIELDS
  body:
    status: 422
    errors:
      - code: INSUFFICIENT_QUANTITY




