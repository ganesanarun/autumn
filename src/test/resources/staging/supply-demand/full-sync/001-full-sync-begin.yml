act:
  url: https://hd-fulfillment-global-supply-demand-service.ecomm-stg.cencosud.com/v2/full-sync
  method: POST
  body: {
    "system": "PARIS_EOM",
    "nodeCode": "test_node",
    "generatedAt": "${generate:datetime}",
    "fileName": "${generate:string:fileName}.csv",
    "businessUnit": "PARIS",
    "countryCode": "CL",
    "batches": [
      {
        "startIndex": 0,
        "endIndex": 2
      }
    ]
  }
asserts:
  status: 200
  body: {
    "jobId": {
      "id": "${json-unit.matches:any-uuid}",
      "createdAt": "${json-unit.matches:any-zoned-date-time}"
    },
    "fullSyncId": {
      "id": "${json-unit.matches:any-uuid}",
      "createdAt": "${json-unit.matches:any-zoned-date-time}"
    },
    "status": "STARTED",
    "beganAt": "${json-unit.matches:any-zoned-date-time}",
    "completedAt": null,
    "reason": null,
    "isFirstFullSync": false,
    "batches": [
      {
        "batchId": {
          "id": "${json-unit.matches:any-uuid}",
          "createdAt": "${json-unit.matches:any-zoned-date-time}"
        },
        "startIndex": 0,
        "endIndex": 2,
        "status": "CREATED",
        "beganAt": null,
        "completedAt": null,
        "reason": null
      }
    ]
  }