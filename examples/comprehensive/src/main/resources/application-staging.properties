# Staging Environment Configuration
# This file demonstrates environment-specific configuration overrides

# Use staging API endpoints
api.base-url=${api.base-url.staging}

# Staging-specific timeouts (longer for debugging)
api.timeout=60000
api.retry-attempts=5

# Enable more detailed logging in staging
logging.level.org.autumn=TRACE
logging.level.com.example=DEBUG

# Staging-specific test data
test.data.user.default-email=staging-test@example.com
test.data.environment=staging