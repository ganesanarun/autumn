# Production Environment Configuration
# This file demonstrates production-specific configuration

# Use production API endpoints
api.base-url=${api.base-url.production}

# Production timeouts (optimized for performance)
api.timeout=15000
api.retry-attempts=2

# Minimal logging in production
logging.level.org.autumn=WARN
logging.level.com.example=WARN

# Production-specific test data
test.data.user.default-email=prod-test@example.com
test.data.environment=production

# Enable custom branding for production reports
autumn.reporting.allure-customization.enabled=true
autumn.reporting.allure-customization.title=Production Test Results
autumn.reporting.allure-customization.brand-name=Production Testing Suite