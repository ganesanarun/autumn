# Autumn Framework Comprehensive Example Configuration
# This file demonstrates all available configuration options for the Autumn framework

# =============================================================================
# Test Summary Generation Configuration
# =============================================================================

# Enable test summary generation (default: true)
autumn.reporting.test-summary.enabled=true

# Output path for the generated summary JSON file (default: build/test-results/summary.json)
autumn.reporting.test-summary.output-path=build/test-results/summary.json