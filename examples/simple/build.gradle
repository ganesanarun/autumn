plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.adarshr.test-logger' version '3.2.0'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = '21'
}

// Disable bootJar since this is a test-only project
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.5'
    }
}

repositories {
    // mavenLocal()  // Use local Maven repository (~/.m2/repository)
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'io.github.ganesanarun:autumn:1.0.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()

    // Pass environment parameter
    systemProperties project.properties.subMap(["env"])
    
    // Generate Allure report after test execution completes
    finalizedBy 'allureReport'
}



testlogger {
    theme 'standard'
    showExceptions true
    showStackTraces true
    showSummary true
    showPassed true
    showSkipped true
    showFailed true
}

allure {
    version = '2.30.0'
}

