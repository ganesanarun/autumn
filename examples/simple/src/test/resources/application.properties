# =============================================================================
# Autumn Reporting Configuration for Tests
# =============================================================================

# Test summary generation - enabled for test execution
autumn.reporting.test-summary.enabled=true
autumn.reporting.test-summary.output-path=build/test-results/summary.json

# Example of test-specific overrides:
# You can disable features for specific test runs by uncommenting:
# autumn.reporting.test-summary.enabled=false
