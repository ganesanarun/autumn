# Autumn Framework Reporting Configuration Examples
# This file demonstrates how to configure the Autumn framework's reporting features
# through Spring Boot auto-configuration

# =============================================================================
# Test Summary Generation Configuration
# =============================================================================

# Enable test summary generation (default: true)
autumn.reporting.test-summary.enabled=true

# Output path for the generated summary JSON file (default: build/test-results/summary.json)
autumn.reporting.test-summary.output-path=build/test-results/summary.json

# Example of disabled test summary generation:
# autumn.reporting.test-summary.enabled=false

# =============================================================================
# Additional Configuration Examples
# =============================================================================

# Application-specific configuration
# api.base-url=https://api.example.com
# api.timeout=30000
# api.token=${API_TOKEN}

# Spring Boot configuration
# logging.level.org.autumn=DEBUG
# logging.level.com.example=INFO

# =============================================================================
# Environment-specific Configuration
# =============================================================================
# You can override these properties using:
# 1. Environment variables (e.g., AUTUMN_REPORTING_TEST_SUMMARY_ENABLED=false)
# 2. Command line arguments (e.g., --autumn.reporting.test-summary.enabled=false)
# 3. Profile-specific properties files (e.g., application-dev.properties)